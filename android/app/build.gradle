plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.pocketkitty.pocket_kitty"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // 模型文件不压缩打包，保证运行时可直接读取（u2netp.tflite 4.4MB）
    // 注意：AGP 8.x 的 androidResources { noCompress "tflite" } 没有该方法，
    // 会导致 Gradle 配置阶段直接失败。用 aaptOptions 写法跨版本稳妥。
    aaptOptions {
        noCompress "tflite"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.pocketkitty.pocket_kitty"
        // TFLite + image_picker 的最低兼容线
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // 关闭多线程 NNAPI 的额外开销，纯 CPU 推理在 u2netp(4.4MB) 上已足够快且稳定
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // 纯离线 App：用 debug 签名即可侧载 / 华为应用市场外部分发；
            // 正式上架前请替换为自己的 release 签名
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 完全离线抠图：TensorFlow Lite 运行时（无任何 Google 服务依赖，无 play-services）
    implementation "org.tensorflow:tensorflow-lite:2.14.0"

    // 读取照片 EXIF 方向（修正横拍/竖拍）
    implementation "androidx.exifinterface:exifinterface:1.3.7"
}
